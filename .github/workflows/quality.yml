name: Quality gate

on:
  push:
    branches: ["main", "refactor/private-market-data-contract", "refactor/private-watch-news-flow", "refactor/private-quote-safety", "feature/radar-v02-evidence-contracts", "feature/local-ost-aot-scenarios"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Verify pinned Engine and source-evidence cases
        run: npm run test:engine

      - name: Verify Alpha public NAV ISIN fallback and privacy
        run: npm run test:alpha-public-nav

      - name: Deterministic contracts, package and import safety
        run: |
          node scripts/build-alpha-pages.mjs
          node --test tests/*.test.mjs
          npm run test:qa-import

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm test

      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  external-connectivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Live provider connectivity (distinct from deterministic safety)
        run: npm run test:live
