name: Out-of-sample filings – Elisa and Apple (research)
on:
  pull_request:
    paths:
      - "scripts/run-out-of-sample-filings.mjs"
      - "tests/out-of-sample-filings.test.mjs"
      - "engine/filings-evidence-gate.mjs"
      - "scripts/filings-receipts.mjs"
      - "tests/filings-evidence-gate.test.mjs"
      - "tests/filings-receipts.test.mjs"
      - "engine/generic-statement-tables.mjs"
      - "tests/generic-statement-tables.test.mjs"
      - ".github/workflows/out-of-sample-filings.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  out-of-sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify existing parser contracts without new issuer aliases
        run: node --test tests/official-filings-pilot.test.mjs tests/issuer-ir-tables-pilot.test.mjs tests/out-of-sample-filings.test.mjs tests/generic-statement-tables.test.mjs tests/filings-evidence-gate.test.mjs tests/filings-receipts.test.mjs
      - name: Read original filings, record each datum and any missing values
        run: node scripts/run-out-of-sample-filings.mjs
      - name: Keep source evidence (not a PWA deploy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-of-sample-pilot-report
          path: out-of-sample-pilot-report.json
          if-no-files-found: warn
