name: Alpha4 post-deployment public origin verification (read-only)

on:
  pull_request:
    paths:
      - ".github/workflows/alpha-live-after-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-deployed-alpha:
    name: Check the actual public Pages origin (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check stable Alpha URL + PWA identity and released data fix
        shell: bash
        run: |
          node <<'NODE'
          import {setTimeout as sleep} from 'node:timers/promises';
          const root='https://osakevahti-alpha-naatti21.pages.dev/';
          async function get(relative){
            const r=await fetch(new URL(relative,root),{cache:'no-store',signal:AbortSignal.timeout(12000)});
            if(!r.ok) throw Error(relative+': HTTP '+r.status);
            return r;
          }
          let html;
          for(let attempt=1;attempt<=6;attempt++){
            try {
              const response=await get('?alpha3-postdeploy='+attempt);
              const text=await response.text();
              if(!text.includes('ALPHA 4 · DATAN EHEYS'))throw Error('old HTML served');
              if(!text.includes('https://naatti21.github.io/osakevahti/'))throw Error('missing live feed origin');
              html=text;
              console.log('PASS real Alpha4 HTML: attempt '+attempt);
              break;
            }catch(e){console.log('pending Alpha4 propagation: '+String(e).slice(0,160));if(attempt<6)await sleep(3500);}
          }
          if(!html)throw Error('Real Alpha4 HTML missing at stable Pages origin');
          const manifest=await (await get('manifest.webmanifest')).json();
          if(manifest.id!=='./?channel=alpha'||manifest.short_name!=='OV Alpha')
            throw Error('Deployed manifest identity changed');
          console.log('PASS deployed PWA installation identity unchanged');
          const sw=await (await get('sw.js')).text();
          if(!sw.includes('osakevahti-shell-v2.16-alpha4-data')||!sw.includes('if (res.ok)'))
            throw Error('Wrong deployed SW or error handling');
          console.log('PASS deployed service worker Alpha4 cache identity and HTTP error guard');
          const corsOrigin=root.slice(0,-1);
          for(const file of ['insights.json','market-data.json']){
            const response=await fetch('https://naatti21.github.io/osakevahti/'+file,{
              headers:{Origin:corsOrigin,Accept:'application/json'},signal:AbortSignal.timeout(12000)});
            if(response.status!==200)throw Error(file+' HTTP '+response.status);
            const cors=response.headers.get('access-control-allow-origin');
            if(cors!=='*'&&cors!==corsOrigin)throw Error(file+' lacks cross-origin browser support');
            const j=await response.json();
            if(file==='insights.json'&&(!j?.dividends?.length||!j?.rockets?.length))
              throw Error('insights.json lacks both populated lists');
            if(file==='market-data.json'&& !j?.quotes)
              throw Error('market-data.json missing quotes');
            console.log('PASS public '+file+' + CORS, shape and nonempty insights where applicable');
          }
          console.log('PASS: All live Alpha4 postdeploy public origin checks. No production writes.');
          NODE
