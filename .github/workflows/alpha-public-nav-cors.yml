name: Alpha public NAV browser-access smoke

on:
  pull_request:
    paths:
      - 'engine/public-nav-backup.mjs'
      - 'scripts/market-data/public-nav-alpha-cors.mjs'
      - '.github/workflows/alpha-public-nav-cors.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cors-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public source CORS for Alpha origin
        run: node scripts/market-data/public-nav-alpha-cors.mjs
