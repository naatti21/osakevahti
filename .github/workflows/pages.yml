name: Osakevahti Pages + market data

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # 5 min välein arkisin. GitHub käyttää UTC-aikaa.
    - cron: "*/5 6-17 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Helsinki market data
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          SYMBOLS = {
              "AMD": "AMD",
              "FORTUM": "FORTUM.HE",
              "NDA-FI": "NDA-FI.HE",
              "VERK": "VERK.HE",
              "METSO": "METSO.HE",
              "FRAMERY": "FRAMERY.HE",
              "IQMX": "IQMX.HE",
          }

          def get_json(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 Osakevahti/1.0",
                      "Accept": "application/json",
                      "Accept-Language": "fi",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read().decode("utf-8"))

          def walk(obj):
              if isinstance(obj, dict):
                  yield obj
                  for v in obj.values():
                      yield from walk(v)
              elif isinstance(obj, list):
                  for v in obj:
                      yield from walk(v)

          def price_number(value):
              if isinstance(value, (int, float)):
                  return float(value)
              if isinstance(value, dict):
                  for key in ("price", "value", "amount"):
                      v = value.get(key)
                      if isinstance(v, (int, float)):
                          return float(v)
              return None

          def nordnet_quote(symbol):
              params = [
                  ("free_text_search", symbol),
                  ("limit", "20"),
                  ("attribute_groups", "PRICE_INFO"),
                  ("attribute_groups", "INSTRUMENT_INFO"),
                  ("attribute_groups", "EXCHANGE_INFO"),
              ]
              url = (
                  "https://public.nordnet.se/api/2/instrument_search/query/stocklist?"
                  + urllib.parse.urlencode(params)
              )
              data = get_json(url)

              candidates = []
              for d in walk(data):
                  info = d.get("instrument_info")
                  pi = d.get("price_info")
                  if not isinstance(info, dict) or not isinstance(pi, dict):
                      continue

                  sym = str(info.get("symbol") or "").upper()
                  if sym != symbol.upper():
                      continue

                  exchange = d.get("exchange_info") if isinstance(d.get("exchange_info"), dict) else {}
                  country = str(exchange.get("exchange_country") or exchange.get("country") or "").upper()
                  candidates.append((country == "FI", d))

              if not candidates:
                  raise RuntimeError("symbolia ei löytynyt")

              candidates.sort(key=lambda x: x[0], reverse=True)
              d = candidates[0][1]
              pi = d.get("price_info") or {}

              price = price_number(pi.get("last")) or price_number(pi.get("close"))
              if not price:
                  raise RuntimeError("hintaa ei löytynyt")

              ts = pi.get("tick_timestamp") or pi.get("timestamp")
              if isinstance(ts, (int, float)):
                  ts = int(ts)
                  if ts < 10_000_000_000:
                      ts *= 1000
              else:
                  ts = int(time.time() * 1000)

              return {
                  "price": price,
                  "change_pct": float(pi.get("diff_pct") or 0),
                  "currency": (d.get("instrument_info") or {}).get("currency") or "EUR",
                  "timestamp": ts,
                  "realtime": bool(pi.get("realtime") is True),
                  "provider": "Nordnet",
              }

          def yahoo_quote(ticker):
              # Intraday 1-minute chart is materially fresher than the daily
              # snapshot/meta values. We use the latest non-null trade.
              q = urllib.parse.quote(ticker, safe="")
              url = (
                  f"https://query1.finance.yahoo.com/v8/finance/chart/{q}"
                  "?range=1d&interval=1m&includePrePost=false"
              )
              data = get_json(url)

              result = (((data.get("chart") or {}).get("result") or [None])[0])
              if not result:
                  raise RuntimeError("Yahoo ei palauttanut intraday-dataa")

              meta = result.get("meta") or {}
              timestamps = result.get("timestamp") or []
              closes = (
                  ((result.get("indicators") or {}).get("quote") or [{}])[0]
                  .get("close") or []
              )

              latest_price = None
              latest_ts = None
              for ts, price in reversed(list(zip(timestamps, closes))):
                  if isinstance(price, (int, float)) and isinstance(ts, (int, float)):
                      latest_price = float(price)
                      latest_ts = int(ts)
                      break

              if latest_price is None:
                  # Fallback to Yahoo's current market value if minute candles
                  # are temporarily missing.
                  p = meta.get("regularMarketPrice")
                  if isinstance(p, (int, float)):
                      latest_price = float(p)
                      t = meta.get("regularMarketTime")
                      latest_ts = int(t) if isinstance(t, (int, float)) else int(time.time())

              if latest_price is None:
                  raise RuntimeError("Yahoo intraday-hinta puuttuu")

              prev = meta.get("chartPreviousClose") or meta.get("previousClose")
              change_pct = (
                  (latest_price - float(prev)) / float(prev) * 100
                  if isinstance(prev, (int, float)) and prev
                  else 0
              )

              return {
                  "price": latest_price,
                  "change_pct": float(change_pct),
                  "currency": meta.get("currency") or "EUR",
                  "timestamp": int(latest_ts * 1000),
                  "realtime": False,
                  "provider": "Yahoo intraday",
              }

          FUND_PAGES = {
              "NORDEA_POHJOISMAAT_SELECT_A": {
                  "url": "https://www.nordeafunds.com/fi/rahastot/nordea-pohjoismaat-indeksi-select-a",
                  "kind": "nordea",
                  "provider": "Nordea Funds",
              },
              "HANDELSBANKEN_USA_INDEKSI": {
                  "url": "https://www.nordnet.fi/rahastot/lista/handelsbanken-usa-index-a1-eur-348def3b",
                  "kind": "nordnet",
                  "provider": "Nordnet fund page",
              },
              "NORDNET_EUROOPPA_INDEKSI": {
                  "url": "https://www.nordnet.fi/rahastot/lista/nordnet-eurooppa-indeksi-eur-c64564c1",
                  "kind": "nordnet",
                  "provider": "Nordnet fund page",
              },
              "NORDNET_KEHITTYVAT_MARKKINAT_INDEKSI": {
                  "url": "https://www.nordnet.fi/rahastot/lista/nordnet-kehittyvat-markkinat-indeksi-eur-a53cd345",
                  "kind": "nordnet",
                  "provider": "Nordnet fund page",
              },
              "NORDNET_MAAILMA_INDEKSI_125": {
                  "url": "https://www.nordnet.fi/rahastot/lista/nordnet-maailma-indeksi-125-eur-f0404f1b",
                  "kind": "nordnet",
                  "provider": "Nordnet fund page",
              },
              "NORDNET_SUOMI_INDEKSI": {
                  "url": "https://www.nordnet.fi/rahastot/lista/nordnet-suomi-indeksi-eur-a401761d",
                  "kind": "nordnet",
                  "provider": "Nordnet fund page",
              },
          }

          def get_text(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
                      "Accept": "text/html,application/xhtml+xml",
                      "Accept-Language": "fi-FI,fi;q=0.9,en;q=0.7",
                  },
              )
              with urllib.request.urlopen(req, timeout=25) as r:
                  raw = r.read().decode("utf-8", errors="replace")

              import html as html_lib
              import re as re_lib

              text = html_lib.unescape(raw)
              text = re_lib.sub(r"<script\b[^>]*>.*?</script>", " ", text, flags=re_lib.I | re_lib.S)
              text = re_lib.sub(r"<style\b[^>]*>.*?</style>", " ", text, flags=re_lib.I | re_lib.S)
              text = re_lib.sub(r"<[^>]+>", " ", text)
              text = re_lib.sub(r"\s+", " ", text)
              return text.strip()

          def parse_decimal(value):
              s = str(value).replace("\xa0", " ").replace(" ", "")
              s = s.replace(",", ".")
              return float(s)

          def fund_page_quote(spec):
              import re as re_lib
              text = get_text(spec["url"])

              if spec["kind"] == "nordnet":
                  m = re_lib.search(
                      r"NAV\s*\((\d{1,2}\.\d{1,2}\.)\)\s*([0-9][0-9\s\xa0]*[,.][0-9]+)\s*EUR",
                      text,
                      flags=re_lib.I,
                  )
                  if not m:
                      raise RuntimeError("NAV-arvoa ei löytynyt rahastosivulta")
                  nav_date = m.group(1)
                  price = parse_decimal(m.group(2))
              elif spec["kind"] == "nordea":
                  vals = re_lib.findall(
                      r"Rahaston arvo\s*\(perusvaluutta\)\s*([0-9]+(?:[,.][0-9]+)?)",
                      text,
                      flags=re_lib.I,
                  )
                  if not vals:
                      raise RuntimeError("rahasto-osuuden arvoa ei löytynyt Nordea Funds -sivulta")
                  price = parse_decimal(vals[-1])
                  nav_date = ""
              else:
                  raise RuntimeError("tuntematon rahastosivun tyyppi")

              return {
                  "price": price,
                  "timestamp": int(time.time() * 1000),
                  "provider": spec["provider"],
                  "realtime": False,
                  "change_pct": 0,
                  "nav_date": nav_date,
              }


          quotes = {}
          errors = {}
          fund_quotes = {}
          fund_errors = {}

          for symbol, yahoo_ticker in SYMBOLS.items():
              candidates = []
              source_errors = {}

              if symbol != "AMD":
                  try:
                      candidates.append(nordnet_quote(symbol))
                  except Exception as e:
                      source_errors["nordnet"] = str(e)

              try:
                  candidates.append(yahoo_quote(yahoo_ticker))
              except Exception as e:
                  source_errors["yahoo"] = str(e)

              if candidates:
                  # Pick the source with the newest actual quote timestamp.
                  # This avoids hard-coding one provider when another is fresher.
                  candidates.sort(
                      key=lambda q: int(q.get("timestamp") or 0),
                      reverse=True,
                  )
                  quotes[symbol] = candidates[0]
                  if len(candidates) > 1:
                      quotes[symbol]["alternatives"] = [
                          {
                              "provider": q.get("provider"),
                              "timestamp": q.get("timestamp"),
                              "price": q.get("price"),
                          }
                          for q in candidates[1:]
                      ]
              else:
                  errors[symbol] = source_errors

          for fund_key, spec in FUND_PAGES.items():
              try:
                  fund_quotes[fund_key] = fund_page_quote(spec)
              except Exception as fund_error:
                  fund_errors[fund_key] = str(fund_error)

          payload = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "quotes": quotes,
              "fund_quotes": fund_quotes,
              "errors": errors,
              "fund_errors": fund_errors,
          }

          with open("market-data.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)

          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY


      - name: Build dividend and Rocket Radar
        shell: bash
        run: |
          python - <<'PY'
          import json
          import math
          import os
          import statistics
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone, timedelta

          PREVIOUS = "https://naatti21.github.io/osakevahti/insights.json"
          REFRESH_HOURS = 4

          DIVIDENDS = {
              "NDA-FI.HE": ("Nordea Bank", "Suomi"),
              "SAMPO.HE": ("Sampo", "Suomi"),
              "FORTUM.HE": ("Fortum", "Suomi"),
              "ELISA.HE": ("Elisa", "Suomi"),
              "KESKOB.HE": ("Kesko B", "Suomi"),
              "UPM.HE": ("UPM-Kymmene", "Suomi"),
              "KNEBV.HE": ("KONE B", "Suomi"),
              "METSO.HE": ("Metso", "Suomi"),
              "HUH1V.HE": ("Huhtamäki", "Suomi"),
              "ORNBV.HE": ("Orion B", "Suomi"),
          }

          ROCKETS = {
              "NVDA": ("NVIDIA", "USA"),
              "AMD": ("AMD", "USA"),
              "AVGO": ("Broadcom", "USA"),
              "PLTR": ("Palantir", "USA"),
              "ARM": ("Arm", "USA"),
              "CRWD": ("CrowdStrike", "USA"),
              "NET": ("Cloudflare", "USA"),
              "APP": ("AppLovin", "USA"),
              "VRT": ("Vertiv", "USA"),
              "RKLB": ("Rocket Lab", "USA"),
              "ASTS": ("AST SpaceMobile", "USA"),
              "IONQ": ("IonQ", "USA"),
              "RGTI": ("Rigetti", "USA"),
              "QBTS": ("D-Wave Quantum", "USA"),
              "SMCI": ("Super Micro Computer", "USA"),
              "LLY": ("Eli Lilly", "USA"),
              "TSM": ("TSMC ADR", "Taiwan/USA"),
              "ASML": ("ASML", "Netherlands/USA"),
              "RHM.DE": ("Rheinmetall", "Germany"),
              "SAAB-B.ST": ("Saab B", "Sweden"),
              "AIR.PA": ("Airbus", "France"),
              "RR.L": ("Rolls-Royce", "UK"),
              "BA.L": ("BAE Systems", "UK"),
              "NOVO-B.CO": ("Novo Nordisk B", "Denmark"),
              "2330.TW": ("TSMC", "Taiwan"),
              "9984.T": ("SoftBank Group", "Japan"),
              "6758.T": ("Sony Group", "Japan"),
              "0700.HK": ("Tencent", "Hong Kong"),
              "3690.HK": ("Meituan", "Hong Kong"),
              "SHOP.TO": ("Shopify", "Canada"),
          }

          def get_json(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 Osakevahti-Radar/1.0",
                      "Accept": "application/json",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read().decode("utf-8"))

          def try_reuse():
              if os.getenv("GITHUB_EVENT_NAME") == "workflow_dispatch":
                  return False
              try:
                  data = get_json(PREVIOUS + "?t=" + str(int(time.time())))
                  ts = datetime.fromisoformat(data["generated_at"].replace("Z","+00:00"))
                  if datetime.now(timezone.utc) - ts < timedelta(hours=REFRESH_HOURS):
                      with open("insights.json","w",encoding="utf-8") as f:
                          json.dump(data,f,ensure_ascii=False,indent=2)
                      print("Reused fresh insights.json")
                      return True
              except Exception as e:
                  print("Previous insights unavailable:", e)
              return False

          if try_reuse():
              raise SystemExit(0)

          def yahoo_history(ticker, years=2, events=False):
              q = urllib.parse.quote(ticker, safe="")
              ev = "&events=div%2Csplits" if events else ""
              url = (
                  f"https://query1.finance.yahoo.com/v8/finance/chart/{q}"
                  f"?range={years}y&interval=1d&includePrePost=false{ev}"
              )
              data = get_json(url)
              result = (((data.get("chart") or {}).get("result") or [None])[0])
              if not result:
                  raise RuntimeError("no chart data")
              ts = result.get("timestamp") or []
              quote = (((result.get("indicators") or {}).get("quote") or [{}])[0])
              closes = quote.get("close") or []
              volumes = quote.get("volume") or []
              rows = []
              for t,c,v in zip(ts,closes,volumes):
                  if isinstance(c,(int,float)):
                      rows.append((int(t),float(c),float(v or 0)))
              dividends = []
              for _,d in (((result.get("events") or {}).get("dividends") or {}).items()):
                  if isinstance(d,dict) and isinstance(d.get("amount"),(int,float)):
                      dividends.append((int(d.get("date") or 0),float(d["amount"])))
              return rows, dividends

          def clamp(x,a=0,b=1):
              return max(a,min(b,x))

          def ret(closes, n):
              if len(closes) <= n or closes[-n-1] <= 0:
                  return 0.0
              return (closes[-1]/closes[-n-1]-1)*100

          def max_drawdown(closes):
              if not closes: return 0.0
              peak=closes[0]; worst=0.0
              for x in closes:
                  peak=max(peak,x)
                  if peak>0: worst=min(worst,(x/peak-1)*100)
              return worst

          def dividend_score(ticker,name,market):
              rows, divs = yahoo_history(ticker,5,True)
              closes=[r[1] for r in rows]
              if len(closes)<200: raise RuntimeError("too little price history")
              now=int(time.time())
              ttm=sum(a for t,a in divs if t>=now-365*86400)
              yld=(ttm/closes[-1]*100) if closes[-1] else 0
              current_year=datetime.now(timezone.utc).year
              years=set(datetime.fromtimestamp(t,timezone.utc).year for t,a in divs if a>0 and current_year-4<=datetime.fromtimestamp(t,timezone.utc).year<=current_year)
              r12=ret(closes,252 if len(closes)>253 else min(200,len(closes)-1))
              dd=max_drawdown(closes[-252:])
              yield_score=clamp(yld/7)*35
              if yld>10: yield_score=max(0,yield_score-10)
              consistency=len(years)/5*30
              trend=clamp((r12+25)/55)*20
              drawdown=clamp((dd+45)/45)*15
              score=round(clamp((yield_score+consistency+trend+drawdown)/100)*100,1)
              label="VAHVA SEURANTA" if score>=75 else "SEURAA" if score>=60 else "NEUTRAALI"
              reason=f"TTM-osinko {yld:.1f} %, osinkoa {len(years)}/5 viime vuodesta, 12 kk {r12:+.1f} %."
              return {"ticker":ticker,"name":name,"market":market,"score":score,"label":label,"yield_pct":round(yld,2),"dividend_years":len(years),"return_12m":round(r12,2),"max_drawdown":round(dd,2),"reason":reason}

          def rocket_score(ticker,name,market):
              rows,_=yahoo_history(ticker,2,False)
              closes=[r[1] for r in rows]
              vols=[r[2] for r in rows]
              if len(closes)<140: raise RuntimeError("too little history")
              m1=ret(closes,21);m3=ret(closes,63);m6=ret(closes,126)
              high=max(closes[-252:] if len(closes)>=252 else closes)
              dist=(closes[-1]/high-1)*100 if high else 0
              recent=sum(vols[-5:])/max(1,len(vols[-5:]))
              base=sum(vols[-25:-5])/max(1,len(vols[-25:-5])) if len(vols)>=25 else recent
              vr=recent/base if base>0 else 1
              rets=[(closes[i]/closes[i-1]-1)*100 for i in range(max(1,len(closes)-21),len(closes)) if closes[i-1]>0]
              vol=statistics.pstdev(rets) if len(rets)>2 else 0
              score=0
              score+=clamp((m1+10)/40)*25
              score+=clamp((m3+15)/75)*25
              score+=clamp((m6+20)/120)*20
              score+=clamp((vr-.8)/1.7)*12
              score+=clamp((dist+25)/25)*13
              score+=5 if sum(closes[-20:])/20 > sum(closes[-60:])/60 else 0
              score-=clamp((vol-3)/5)*10
              score=round(clamp(score/100)*100,1)
              label="RAKETTI" if score>=80 else "KUUMA" if score>=68 else "SEURAA"
              risk="erittäin korkea" if vol>=5 else "korkea" if vol>=3 else "kohtalainen"
              reason=f"52v huippuun {dist:.1f} %, 20 pv volatiliteetti {vol:.1f} %, volyymi {vr:.1f}×."
              return {"ticker":ticker,"name":name,"market":market,"score":score,"label":label,"m1":round(m1,2),"m3":round(m3,2),"m6":round(m6,2),"volume_ratio":round(vr,2),"distance_high":round(dist,2),"volatility":round(vol,2),"risk":risk,"reason":reason}

          dividends=[]
          dividend_errors={}
          for ticker,(name,market) in DIVIDENDS.items():
              try: dividends.append(dividend_score(ticker,name,market))
              except Exception as e: dividend_errors[ticker]=str(e)
          dividends.sort(key=lambda x:x["score"],reverse=True)

          rockets=[]
          rocket_errors={}
          for ticker,(name,market) in ROCKETS.items():
              try: rockets.append(rocket_score(ticker,name,market))
              except Exception as e: rocket_errors[ticker]=str(e)
          rockets.sort(key=lambda x:x["score"],reverse=True)

          payload={
              "generated_at":datetime.now(timezone.utc).isoformat(),
              "method_version":"2.3",
              "dividends":dividends[:8],
              "rockets":rockets[:8],
              "rocket_universe_count":len(ROCKETS),
              "dividend_universe_count":len(DIVIDENDS),
              "errors":{"dividends":dividend_errors,"rockets":rocket_errors},
          }
          with open("insights.json","w",encoding="utf-8") as f:
              json.dump(payload,f,ensure_ascii=False,indent=2)
          print(json.dumps(payload,ensure_ascii=False,indent=2))
          PY


      - name: Build focused portfolio news
        shell: bash
        run: |
          python - <<'PY'
          import email.utils
          import json
          import os
          import re
          import time
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta

          PREVIOUS = "https://naatti21.github.io/osakevahti/news-data.json"
          REFRESH_HOURS = 2

          COMPANIES = [
              {"symbol":"AMD","name":"Advanced Micro Devices","query":'"Advanced Micro Devices" earnings OR revenue OR guidance OR acquisition OR "data center" OR AI',"locale":("en-US","US","US:en"),"must":["advanced micro devices"," amd "],"noise":["review","benchmark","driver download","best gpu","gaming pc","deal on ryzen"]},
              {"symbol":"FORTUM","name":"Fortum","query":'Fortum tulos OR osinko OR investointi OR sähkö OR strategia OR ohjeistus',"locale":("fi","FI","FI:fi"),"must":["fortum"],"noise":[]},
              {"symbol":"NDA-FI","name":"Nordea","query":'Nordea tulos OR osinko OR takaisinosto OR korko OR vakavaraisuus OR strategia',"locale":("fi","FI","FI:fi"),"must":["nordea"],"noise":[]},
              {"symbol":"VERK","name":"Verkkokauppa.com","query":'"Verkkokauppa.com" tulos OR liikevaihto OR osinko OR ohjeistus OR strategia',"locale":("fi","FI","FI:fi"),"must":["verkkokauppa.com"],"noise":["alennus","tarjous","black friday"]},
              {"symbol":"FRAMERY","name":"Framery","query":'Framery tulos OR liikevaihto OR kasvu OR tilaus OR listautuminen OR strategia',"locale":("fi","FI","FI:fi"),"must":["framery"],"noise":[]},
              {"symbol":"IQMX","name":"IQM Quantum Computers","query":'"IQM Quantum Computers" funding OR contract OR partnership OR investment OR quantum OR rahoitus OR sopimus',"locale":("en-US","US","US:en"),"must":["iqm quantum","iqm quantum computers"],"noise":[]},
              {"symbol":"METSO","name":"Metso","query":'Metso order OR contract OR acquisition OR results OR tilaus OR tulos OR yrityskauppa',"locale":("en-US","US","US:en"),"must":["metso"],"noise":[]},
          ]

          FINANCE_WORDS = ["earnings","revenue","guidance","profit","dividend","buyback","acquisition","contract","order","investment","strategy","results","outlook","tulos","liikevaihto","osinko","ohjeistus","tilaus","sopimus","investointi","strategia","yrityskauppa","takaisinosto","rahoitus"]

          def get_bytes(url):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 Osakevahti-News/1.0","Accept":"application/rss+xml,application/xml,text/xml"})
              with urllib.request.urlopen(req,timeout=20) as r:
                  return r.read()

          def get_json(url):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 Osakevahti-News/1.0","Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=20) as r:
                  return json.loads(r.read().decode("utf-8"))

          def reuse_previous():
              if os.getenv("GITHUB_EVENT_NAME")=="workflow_dispatch":
                  return False
              try:
                  data=get_json(PREVIOUS+"?t="+str(int(time.time())))
                  ts=datetime.fromisoformat(data["generated_at"].replace("Z","+00:00"))
                  if datetime.now(timezone.utc)-ts<timedelta(hours=REFRESH_HOURS):
                      with open("news-data.json","w",encoding="utf-8") as f:
                          json.dump(data,f,ensure_ascii=False,indent=2)
                      print("Reused fresh news-data.json")
                      return True
              except Exception as e:
                  print("Previous news unavailable:",e)
              return False

          if reuse_previous():
              raise SystemExit(0)

          def google_news(company):
              hl,gl,ceid=company["locale"]
              q=company["query"]+" when:7d"
              url="https://news.google.com/rss/search?"+urllib.parse.urlencode({"q":q,"hl":hl,"gl":gl,"ceid":ceid})
              root=ET.fromstring(get_bytes(url))
              out=[]
              now=time.time()
              for item in root.findall(".//item"):
                  title=(item.findtext("title") or "").strip()
                  link=(item.findtext("link") or "").strip()
                  pub=(item.findtext("pubDate") or "").strip()
                  source_node=item.find("source")
                  source=(source_node.text.strip() if source_node is not None and source_node.text else "")
                  try:
                      dt=email.utils.parsedate_to_datetime(pub)
                      if dt.tzinfo is None: dt=dt.replace(tzinfo=timezone.utc)
                      ts=int(dt.timestamp())
                  except Exception:
                      ts=int(now)
                  low=(" "+title.lower()+" ")
                  if not any(m in low for m in company["must"]):
                      continue
                  if any(noise in low for noise in company["noise"]):
                      continue
                  score=4
                  score+=sum(1.2 for w in FINANCE_WORDS if w in low)
                  age_days=max(0,(now-ts)/86400)
                  if age_days<1: score+=2
                  elif age_days<3: score+=1
                  if source.lower() in {"reuters","bloomberg","cnbc","financial times","kauppalehti","talouselämä","yle","helsingin sanomat"}:
                      score+=1
                  if score<5:
                      continue
                  out.append({"symbol":company["symbol"],"company":company["name"],"headline":title,"url":link,"source":source or "Google News","datetime":ts,"relevance":round(score,1),"summary":""})
              out.sort(key=lambda x:(x["relevance"],x["datetime"]),reverse=True)
              return out[:2]

          items=[];errors={};seen=set()
          for c in COMPANIES:
              try:
                  for x in google_news(c):
                      key=re.sub(r"\W+"," ",x["headline"].lower()).strip()
                      if key in seen: continue
                      seen.add(key);items.append(x)
              except Exception as e:
                  errors[c["symbol"]]=str(e)

          items.sort(key=lambda x:(x["relevance"],x["datetime"]),reverse=True)
          payload={"generated_at":datetime.now(timezone.utc).isoformat(),"items":items[:14],"company_count":len(COMPANIES),"errors":errors,"method":"company-specific Google News RSS + relevance filter v1"}
          with open("news-data.json","w",encoding="utf-8") as f:
              json.dump(payload,f,ensure_ascii=False,indent=2)
          print(json.dumps(payload,ensure_ascii=False,indent=2))
          PY


      - name: Build stock risk metrics
        shell: bash
        run: |
          python - <<'PY'
          import json
          import math
          import os
          import statistics
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone, timedelta

          PREVIOUS = "https://naatti21.github.io/osakevahti/risk-data.json"
          REFRESH_HOURS = 4
          SYMBOLS = {
              "AMD": "AMD",
              "FORTUM": "FORTUM.HE",
              "NDA-FI": "NDA-FI.HE",
              "VERK": "VERK.HE",
              "FRAMERY": "FRAMERY.HE",
              "IQMX": "IQMX.HE",
              "METSO": "METSO.HE",
          }

          def get_json(url):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 Osakevahti-Risk/1.0","Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=20) as r:
                  return json.loads(r.read().decode("utf-8"))

          def reuse_previous():
              if os.getenv("GITHUB_EVENT_NAME")=="workflow_dispatch":
                  return False
              try:
                  data=get_json(PREVIOUS+"?t="+str(int(time.time())))
                  ts=datetime.fromisoformat(data["generated_at"].replace("Z","+00:00"))
                  if datetime.now(timezone.utc)-ts<timedelta(hours=REFRESH_HOURS):
                      with open("risk-data.json","w",encoding="utf-8") as f:
                          json.dump(data,f,ensure_ascii=False,indent=2)
                      print("Reused fresh risk-data.json")
                      return True
              except Exception as e:
                  print("Previous risk data unavailable:",e)
              return False

          if reuse_previous():
              raise SystemExit(0)

          def history(ticker):
              q=urllib.parse.quote(ticker,safe="")
              url=f"https://query1.finance.yahoo.com/v8/finance/chart/{q}?range=1y&interval=1d&includePrePost=false"
              result=(((get_json(url).get("chart") or {}).get("result") or [None])[0])
              if not result:
                  raise RuntimeError("no daily history")
              quote=(((result.get("indicators") or {}).get("quote") or [{}])[0])
              ts=result.get("timestamp") or []
              highs=quote.get("high") or []
              lows=quote.get("low") or []
              closes=quote.get("close") or []
              rows=[]
              for t,h,l,c in zip(ts,highs,lows,closes):
                  if all(isinstance(x,(int,float)) for x in (h,l,c)):
                      rows.append((int(t),float(h),float(l),float(c)))
              return rows

          def metrics(ticker):
              rows=history(ticker)
              if len(rows)<60: raise RuntimeError("too little history")
              highs=[r[1] for r in rows]
              lows=[r[2] for r in rows]
              closes=[r[3] for r in rows]

              trs=[]
              for i in range(1,len(rows)):
                  h,l,c=rows[i][1],rows[i][2],rows[i][3]
                  prev=rows[i-1][3]
                  trs.append(max(h-l,abs(h-prev),abs(l-prev)))
              atr14=sum(trs[-14:])/14 if len(trs)>=14 else None

              high20=max(highs[-20:])
              low20=min(lows[-20:])
              high60=max(highs[-60:])
              sma20=sum(closes[-20:])/20
              sma50=sum(closes[-50:])/50
              close=closes[-1]

              if close>sma20>sma50: trend="nousu"
              elif close<sma20<sma50: trend="lasku"
              else: trend="sivuttainen"

              daily=[]
              for i in range(max(1,len(closes)-21),len(closes)):
                  if closes[i-1]>0:
                      daily.append((closes[i]/closes[i-1]-1)*100)
              vol20=statistics.pstdev(daily) if len(daily)>2 else 0

              return {
                  "close":round(close,6),
                  "atr14":round(atr14,6) if atr14 else None,
                  "atr14_pct":round(atr14/close*100,3) if atr14 and close else None,
                  "high20":round(high20,6),
                  "low20":round(low20,6),
                  "high60":round(high60,6),
                  "sma20":round(sma20,6),
                  "sma50":round(sma50,6),
                  "vol20_daily_pct":round(vol20,3),
                  "trend":trend,
                  "timestamp":int(rows[-1][0]*1000),
              }

          out={};errors={}
          for symbol,ticker in SYMBOLS.items():
              try: out[symbol]=metrics(ticker)
              except Exception as e: errors[symbol]=str(e)

          payload={
              "generated_at":datetime.now(timezone.utc).isoformat(),
              "metrics":out,
              "errors":errors,
              "method":"Yahoo daily OHLC: ATR14, 20d range, SMA20/50 v1"
          }
          with open("risk-data.json","w",encoding="utf-8") as f:
              json.dump(payload,f,ensure_ascii=False,indent=2)
          print(json.dumps(payload,ensure_ascii=False,indent=2))
          PY


      - name: Build unified portfolio status
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          from datetime import datetime, timezone

          def read_json(path, default):
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return default

          market = read_json("market-data.json", {})
          risk = read_json("risk-data.json", {})
          market_context = read_json("market-context.json", {})
          quotes = market.get("quotes") or {}
          risk_metrics = risk.get("metrics") or {}
          now_ms = int(time.time() * 1000)

          assets = {}

          for symbol, q in quotes.items():
              price = q.get("price")
              change = q.get("change_pct")
              ts = q.get("timestamp")
              source = q.get("provider") or "unknown"

              age_min = None
              if isinstance(ts, (int, float)):
                  age_min = max(0, (now_ms - int(ts)) / 60000)

              alert_code = "NONE"
              severity = "info"
              reason = "Ei markkinahälytystä."

              if age_min is not None and age_min > 60:
                  alert_code = "STALE_DATA"
                  severity = "watch"
                  reason = f"Hintadata on {age_min:.0f} minuuttia vanhaa."

              if isinstance(change, (int, float)):
                  if change >= 4:
                      alert_code = "DAY_UP_4"
                      severity = "watch"
                      reason = f"Päivän nousu {change:+.2f} % ylittää +4 % triggerin."
                  elif change <= -4:
                      alert_code = "DAY_DOWN_4"
                      severity = "critical"
                      reason = f"Päivän lasku {change:+.2f} % alittaa -4 % triggerin."

              rm = risk_metrics.get(symbol) or {}
              vol = rm.get("vol20_daily_pct")

              if alert_code == "NONE" and isinstance(vol, (int, float)) and vol >= 5:
                  alert_code = "HIGH_VOL"
                  severity = "watch"
                  reason = f"20 päivän päivittäinen volatiliteetti on korkea ({vol:.1f} %)."

              assets[symbol] = {
                  "ticker": symbol,
                  "price": price,
                  "day_change_pct": change,
                  "quote_timestamp": ts,
                  "age_minutes_at_generation": round(age_min, 1) if age_min is not None else None,
                  "source": source,
                  "realtime": bool(q.get("realtime") is True),
                  "currency": q.get("currency"),
                  "risk": {
                      "atr14": rm.get("atr14"),
                      "atr14_pct": rm.get("atr14_pct"),
                      "high20": rm.get("high20"),
                      "low20": rm.get("low20"),
                      "sma20": rm.get("sma20"),
                      "sma50": rm.get("sma50"),
                      "vol20_daily_pct": rm.get("vol20_daily_pct"),
                      "trend": rm.get("trend"),
                  },
                  "alert": {
                      "code": alert_code,
                      "severity": severity,
                      "reason": reason,
                  },
              }

          payload = {
              "schema_version": "1.0",
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "source_files": {
                  "market_data_generated_at": market.get("generated_at"),
                  "risk_data_generated_at": risk.get("generated_at"),
              },
              "coverage": {
                  "stocks": len(assets),
                  "alerts": sum(1 for a in assets.values() if a["alert"]["code"] != "NONE"),
                  "stale": sum(1 for a in assets.values() if a["alert"]["code"] == "STALE_DATA"),
              },
              "market_context": market_context,
              "assets": assets,
              "privacy": {
                  "contains_positions": False,
                  "contains_quantities": False,
                  "contains_cost_basis": False,
                  "note": "Public market snapshot only. Private portfolio data stays in browser localStorage.",
              },
          }

          with open("portfolio-status.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)

          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY


      - name: Build market context
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          SYMBOLS = {
              "HELSINKI": ("^OMXH25", "OMX Helsinki 25"),
              "EUROPE": ("^STOXX50E", "Euro Stoxx 50"),
              "SP_FUT": ("ES=F", "S&P 500 futures"),
              "NQ_FUT": ("NQ=F", "Nasdaq 100 futures"),
              "NASDAQ": ("^IXIC", "Nasdaq Composite"),
              "BRENT": ("BZ=F", "Brent crude"),
              "VIX": ("^VIX", "VIX"),
          }

          def get_json(url):
              req = urllib.request.Request(url, headers={
                  "User-Agent":"Mozilla/5.0 Osakevahti-MarketContext/1.0",
                  "Accept":"application/json",
              })
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read().decode("utf-8"))

          def quote(ticker):
              q = urllib.parse.quote(ticker, safe="")
              url = f"https://query1.finance.yahoo.com/v8/finance/chart/{q}?range=1d&interval=5m&includePrePost=true"
              data = get_json(url)
              result = (((data.get("chart") or {}).get("result") or [None])[0])
              if not result:
                  raise RuntimeError("no chart result")
              meta = result.get("meta") or {}
              timestamps = result.get("timestamp") or []
              closes = (((result.get("indicators") or {}).get("quote") or [{}])[0].get("close") or [])
              price = None
              ts = None
              for t,c in reversed(list(zip(timestamps, closes))):
                  if isinstance(c,(int,float)) and isinstance(t,(int,float)):
                      price=float(c); ts=int(t); break
              if price is None and isinstance(meta.get("regularMarketPrice"),(int,float)):
                  price=float(meta["regularMarketPrice"])
                  ts=int(meta.get("regularMarketTime") or time.time())
              if price is None:
                  raise RuntimeError("price missing")
              prev = meta.get("chartPreviousClose") or meta.get("previousClose")
              change = ((price-float(prev))/float(prev)*100) if isinstance(prev,(int,float)) and prev else 0.0
              return {
                  "price":price,
                  "day_change_pct":change,
                  "quote_timestamp":int(ts*1000),
                  "currency":meta.get("currency"),
                  "provider":"Yahoo intraday",
              }

          assets={}
          errors={}
          for key,(ticker,name) in SYMBOLS.items():
              try:
                  q=quote(ticker)
                  q.update({"ticker":ticker,"name":name})
                  assets[key]=q
              except Exception as e:
                  errors[key]=str(e)

          payload={
              "generated_at":datetime.now(timezone.utc).isoformat(),
              "assets":assets,
              "errors":errors,
              "method":"Yahoo intraday 5m market context v1"
          }
          with open("market-context.json","w",encoding="utf-8") as f:
              json.dump(payload,f,ensure_ascii=False,indent=2)
          print(json.dumps(payload,ensure_ascii=False,indent=2))
          PY

