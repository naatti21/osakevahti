name: Official filings two-company pilot (research only)
on:
  pull_request:
    paths:
      - "engine/official-filings-pilot.mjs"
      - "scripts/run-official-filings-pilot.mjs"
      - "tests/official-filings-pilot.test.mjs"
      - "engine/filings-evidence-gate.mjs"
      - "scripts/filings-receipts.mjs"
      - "tests/filings-evidence-gate.test.mjs"
      - "tests/filings-receipts.test.mjs"
      - "engine/issuer-ir-tables-pilot.mjs"
      - "tests/issuer-ir-tables-pilot.test.mjs"
      - "engine/generic-statement-tables.mjs"
      - "tests/generic-statement-tables.test.mjs"
      - ".github/workflows/official-filings-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generic-source contract tests
        run: node --test tests/official-filings-pilot.test.mjs tests/issuer-ir-tables-pilot.test.mjs tests/generic-statement-tables.test.mjs tests/filings-evidence-gate.test.mjs tests/filings-receipts.test.mjs
      - name: Read-only SEC and ESEF source evidence
        run: node scripts/run-official-filings-pilot.mjs
