name: Official filings two-company pilot (research only)
on:
  pull_request:
    paths:
      - "engine/official-filings-pilot.mjs"
      - "scripts/run-official-filings-pilot.mjs"
      - "tests/official-filings-pilot.test.mjs"
      - ".github/workflows/official-filings-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generic-source contract tests
        run: node --test tests/official-filings-pilot.test.mjs
      - name: Read-only SEC and ESEF source evidence
        run: node scripts/run-official-filings-pilot.mjs
