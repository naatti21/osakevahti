name: Issue 77 PWA deterministic QA

on:
  push:
    branches: [fix/issue77-pwa-lifecycle, feat/issue77-fund-identity-review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --package-lock=false
      - run: npx playwright install --with-deps chromium
      - name: Build locally without deployment
        run: node scripts/build-alpha-pages.mjs
      - name: Node regressions and import guards
        run: |
          node --test tests/*.test.mjs
          node tests/import-qa/qa8-guards.mjs
      - name: Deterministic browser suite (external-provider and OCR stress checks remain separate)
        run: npx playwright test --workers=2 --retries=0 --grep-invert '@ocr-stress|browser fetch from official direct FX|Alpha3 browser gets all six live|Alpha3 original refresh dependencies'
      - name: Repeat actual PWA lifecycle transitions without retries
        run: npx playwright test tests/e2e/pwa-offline-sw.spec.mjs tests/e2e/pwa-upgrade-path.spec.mjs tests/e2e/pwa-navigation-http-error.spec.mjs --workers=2 --retries=0 --repeat-each=5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue77-pwa-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
