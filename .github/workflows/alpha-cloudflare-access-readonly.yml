name: Alpha Cloudflare credential presence and target verification (read-only)

on:
  pull_request:
    paths:
      - ".github/workflows/alpha-cloudflare-access-readonly.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-cloudflare-alpha:
    name: Check Cloudflare Pages token without revealing it (NO DEPLOY)
    # Never grant forked PRs access to secrets.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify credentials exist and can read the existing Alpha Pages project
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          set +x
          {
            echo "## Read-only Cloudflare Pages access check"
            echo "Test target: osakevahti-alpha-naatti21"
            echo "This test does not upload, deploy, modify Cloudflare, or read secret values into the log."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::warning::GitHub secret CLOUDFLARE_API_TOKEN is missing or unavailable."
            echo "CLOUDFLARE_API_TOKEN: **NOT AVAILABLE**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "CLOUDFLARE_API_TOKEN: **PRESENT**" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "::warning::GitHub secret CLOUDFLARE_ACCOUNT_ID is missing or unavailable."
            echo "CLOUDFLARE_ACCOUNT_ID: **NOT AVAILABLE**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "CLOUDFLARE_ACCOUNT_ID: **PRESENT**" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "Pages API access: **NOT TESTED (missing credentials)**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Token verification is read-only; report only HTTP status and active flag.
          set +e
          verify_status="$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
            --output "$RUNNER_TEMP/cloudflare-token-verify.json" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")"
          verify_rc=$?
          set -e
          echo "Cloudflare token verification HTTP: ${verify_status}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$verify_rc" -eq 0 && "$verify_status" == "200" ]]; then
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/cloudflare-token-verify.json','utf8'));
          const ok=r.success===true && r.result?.status==='active';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Cloudflare token active: **'+(ok?'YES':'NOT VERIFIED')+'**\\n');
          console.log('TOKEN_VERIFY_ACTIVE='+ok);
          NODE
          fi
          set +e
          status="$(curl --silent --show-error --connect-timeout 10 --max-time 20             --output "$RUNNER_TEMP/cloudflare-alpha-response.json"             --write-out '%{http_code}'             --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             --header "Accept: application/json"             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/osakevahti-alpha-naatti21")"
          curl_rc=$?
          set -e
          if [[ "$curl_rc" -ne 0 || "$status" != "200" ]]; then
            echo "::warning::Read-only Pages API GET failed (HTTP ${status}, network status ${curl_rc})."
            echo "Pages API access: **FAIL (HTTP ${status})**" >> "$GITHUB_STEP_SUMMARY"
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          try {
            const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/cloudflare-alpha-response.json','utf8'));
            const codes=(r.errors||[]).map(e=>String(e.code||'no-code')).slice(0,5);
            console.log('PAGES_API_ERROR_CODES='+JSON.stringify(codes));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Pages API error codes (no secret values): **'+codes.join(',')+'**\\n');
          }catch { console.log('PAGES_API_ERROR_CODES=unavailable'); }
          NODE
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const data=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/cloudflare-alpha-response.json','utf8'));
          if(data.success!==true || data.result?.name!=='osakevahti-alpha-naatti21'){
            throw Error('Pages project API replied, but the target name or success result did not match');
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            'Pages API access: **PASS — existing Alpha Pages project is readable**\n');
          console.log('PASS: existing Cloudflare Pages Alpha project accessible via configured GitHub secrets. No deployment performed.');
          NODE
